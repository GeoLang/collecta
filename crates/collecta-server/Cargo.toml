[package]
name = "collecta-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Collecta REST API server — form management, submission ingestion, sync endpoints"

[dependencies]
collecta-core = { path = "../collecta-core" }
collecta-xlsform = { path = "../collecta-xlsform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
jsonwebtoken = "9"
argon2 = { version = "0.5", features = ["std"] }
# openrosa: xml read/write, basic-auth decode, protocol-mandated form hash.
# quick-xml and base64 versions match what calamine/jsonwebtoken already lock.
quick-xml = "0.41"
base64 = "0.22"
md-5 = "0.11"
sha2 = "0.10"
# publishing to ptolemy; same version and features collecta-cli already locks.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }

[dev-dependencies]
jsonwebtoken = "9"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
rust_xlsxwriter = "0.96"
