[package]
name = "collecta-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Collecta command-line client — offline submission queue and push to the server"

[dependencies]
collecta-core = { path = "../collecta-core" }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt", "net", "time"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
